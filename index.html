<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Elite Gym</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#0f0f0f;
      color:white;
      overflow-x:hidden;
    }

    /* HERO SECTION */

    .hero{
      height:100vh;
      background:
      linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.7)),
      url('m2nyovyc9wprx3f8rhvc.jpeg');

      background-size:cover;
      background-position:center;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;

      animation: zoom 10s infinite alternate;
    }

    @keyframes zoom{
      from{
        transform:scale(1);
      }

      to{
        transform:scale(1.05);
      }
    }

    .hero-content{
      animation: fadeUp 1.5s ease;
      padding:20px;
    }

    @keyframes fadeUp{
      from{
        opacity:0;
        transform:translateY(40px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .hero h1{
      font-size:60px;
      margin-bottom:20px;
      letter-spacing:2px;
    }

    .hero p{
      font-size:20px;
      margin-bottom:30px;
      color:#ddd;
    }

    .btn{
      padding:14px 35px;
      border:none;
      background:#f5b041;
      color:black;
      font-size:18px;
      border-radius:50px;
      cursor:pointer;
      transition:0.3s;
      font-weight:bold;
    }

    .btn:hover{
      transform:scale(1.08);
      background:white;
    }

    /* ABOUT */

    .about{
      padding:80px 20px;
      text-align:center;
    }

    .about h2{
      font-size:40px;
      margin-bottom:20px;
    }

    .about p{
      max-width:700px;
      margin:auto;
      color:#bbb;
      line-height:1.7;
      font-size:18px;
    }

    /* MOBILE */

    @media(max-width:768px){

      .hero h1{
        font-size:40px;
      }

      .hero p{
        font-size:16px;
      }

    }

  </style>
</head>

<body>

  <!-- HERO SECTION -->

  <section class="hero">

    <div class="hero-content">
      <h1>ELITE FITNESS GYM</h1>

      <p>Train Hard • Stay Strong • Transform Yourself</p>

      <button class="btn">Join Now</button>
    </div>

  </section>

  <!-- ABOUT -->

  <section class="about">

    <h2>About Our Gym</h2>

    <p>
      Experience premium fitness training with modern equipment,
      professional trainers, and a powerful workout environment.
      Build strength, confidence, and discipline with us.
    </p>

  </section>

</body>
</html>
